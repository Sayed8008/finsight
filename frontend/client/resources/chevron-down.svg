<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10">
  <!-- The arrow on every combo box and date field. An asset rather than a
       stylesheet trick: the CSS zero-size-plus-borders triangle is a browser
       technique, and Qt draws it as a small rectangle. -->
  <path d="M1.5 3.5 L5 7 L8.5 3.5" fill="none" stroke="#6b7480"
        stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
